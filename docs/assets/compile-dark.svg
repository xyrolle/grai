<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Compiling the catalogs</title>
<text x="16" y="24" font-size="16" font-weight="600" fill="#f0efec">Compiling the catalogs</text>
<text x="16" y="44" font-size="13" fill="#c3c2b7">Seconds for a full compile of three locales, in a new process;</text>
<text x="16" y="61" font-size="13" fill="#c3c2b7">lower is better</text>
<line x1="247" y1="82" x2="247" y2="334" stroke="#383835" stroke-width="1"/>
<text x="247" y="351" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">0</text>
<line x1="294" y1="82" x2="294" y2="334" stroke="#2c2c2a" stroke-width="1"/>
<text x="294" y="351" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">10</text>
<line x1="341" y1="82" x2="341" y2="334" stroke="#2c2c2a" stroke-width="1"/>
<text x="341" y="351" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">20</text>
<line x1="388" y1="82" x2="388" y2="334" stroke="#2c2c2a" stroke-width="1"/>
<text x="388" y="351" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">30</text>
<text x="16" y="100" font-size="13" font-weight="600" fill="#c3c2b7">6,366 keys</text>
<text x="237" y="131" font-size="14" text-anchor="end" font-weight="600" fill="#f0efec">grai</text>
<path d="M247,119H247A1,1 0 0 1 248,120V132A1,1 0 0 1 247,133H247Z" fill="#3987e5"/>
<text x="254" y="131" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">95 ms</text>
<text x="237" y="163" font-size="14" text-anchor="end" fill="#f0efec">Paraglide</text>
<path d="M247,151H259.4A4,4 0 0 1 263.4,155V161A4,4 0 0 1 259.4,165H247Z" fill="#898781"/>
<text x="269.4" y="163" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">3.50 s</text>
<text x="237" y="195" font-size="14" text-anchor="end" fill="#f0efec">Paraglide, with declarations</text>
<path d="M247,183H286A4,4 0 0 1 290,187V193A4,4 0 0 1 286,197H247Z" fill="#898781"/>
<text x="296" y="195" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">9.16 s</text>
<text x="16" y="224" font-size="13" font-weight="600" fill="#c3c2b7">13,326 keys</text>
<text x="237" y="255" font-size="14" text-anchor="end" font-weight="600" fill="#f0efec">grai</text>
<path d="M247,243H247A1.4,1.4 0 0 1 248.4,244.4V255.6A1.4,1.4 0 0 1 247,257H247Z" fill="#3987e5"/>
<text x="254.4" y="255" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">290 ms</text>
<text x="237" y="287" font-size="14" text-anchor="end" fill="#f0efec">Paraglide</text>
<path d="M247,275H296A4,4 0 0 1 300,279V285A4,4 0 0 1 296,289H247Z" fill="#898781"/>
<text x="306" y="287" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">11.3 s</text>
<text x="237" y="319" font-size="14" text-anchor="end" fill="#f0efec">Paraglide, with declarations</text>
<path d="M247,307H360.9A4,4 0 0 1 364.9,311V317A4,4 0 0 1 360.9,321H247Z" fill="#898781"/>
<text x="370.9" y="319" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">25.1 s</text>
<text x="388" y="371" font-size="12" text-anchor="end" fill="#c3c2b7">seconds</text>
</svg>
