<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 211" width="480" height="211" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Choosing an ordinal form in ru</title>
<rect x="0.5" y="0.5" width="479" height="210" rx="6" fill="#0d1117" stroke="#2c2c2a"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#f0efec">Choosing an ordinal form in ru</text>
<text x="16" y="44" font-size="13" fill="#c3c2b7">Nanoseconds a choice, for each count from 0 to 999; lower is better</text>
<line x1="216" y1="65" x2="216" y2="165" stroke="#383835" stroke-width="1"/>
<text x="216" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">0</text>
<line x1="250.4" y1="65" x2="250.4" y2="165" stroke="#2c2c2a" stroke-width="1"/>
<text x="250.4" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">100</text>
<line x1="284.8" y1="65" x2="284.8" y2="165" stroke="#2c2c2a" stroke-width="1"/>
<text x="284.8" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">200</text>
<line x1="319.2" y1="65" x2="319.2" y2="165" stroke="#2c2c2a" stroke-width="1"/>
<text x="319.2" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">300</text>
<line x1="353.6" y1="65" x2="353.6" y2="165" stroke="#2c2c2a" stroke-width="1"/>
<text x="353.6" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">400</text>
<line x1="388" y1="65" x2="388" y2="165" stroke="#2c2c2a" stroke-width="1"/>
<text x="388" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">500</text>
<text x="206" y="86" font-size="14" text-anchor="end" font-weight="600" fill="#f0efec">grai</text>
<path d="M216,74H216A1.5,1.5 0 0 1 217.5,75.5V86.5A1.5,1.5 0 0 1 216,88H216Z" fill="#3987e5"/>
<text x="223.5" y="86" font-size="14" fill="#f0efec" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">4.4 ns</text>
<text x="206" y="118" font-size="14" text-anchor="end" fill="#f0efec">Intl.PluralRules, cached</text>
<path d="M216,106H260.4A4,4 0 0 1 264.4,110V116A4,4 0 0 1 260.4,120H216Z" fill="#898781"/>
<text x="270.4" y="118" font-size="14" fill="#f0efec" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">141 ns</text>
<text x="206" y="150" font-size="14" text-anchor="end" fill="#f0efec">Paraglide</text>
<path d="M216,138H381.7A4,4 0 0 1 385.7,142V148A4,4 0 0 1 381.7,152H216Z" fill="#898781"/>
<text x="391.7" y="150" font-size="14" fill="#f0efec" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">493 ns</text>
<text x="388" y="202" font-size="12" text-anchor="end" fill="#c3c2b7">nanoseconds a choice</text>
</svg>
