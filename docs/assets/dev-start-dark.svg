<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>A cold Vite dev server, until its page shows</title>
<rect x="0.5" y="0.5" width="479" height="259" rx="6" fill="#0d1117" stroke="#2c2c2a"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#f0efec">A cold Vite dev server, until its page shows</text>
<text x="16" y="44" font-size="13" fill="#c3c2b7">Milliseconds from the server's creation, with no output or cache;</text>
<text x="16" y="61" font-size="13" fill="#c3c2b7">lower is better</text>
<line x1="99" y1="82" x2="99" y2="214" stroke="#383835" stroke-width="1"/>
<text x="99" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">0</text>
<line x1="195.3" y1="82" x2="195.3" y2="214" stroke="#2c2c2a" stroke-width="1"/>
<text x="195.3" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">2,000</text>
<line x1="291.7" y1="82" x2="291.7" y2="214" stroke="#2c2c2a" stroke-width="1"/>
<text x="291.7" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">4,000</text>
<line x1="388" y1="82" x2="388" y2="214" stroke="#2c2c2a" stroke-width="1"/>
<text x="388" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">6,000</text>
<text x="89" y="103" font-size="14" text-anchor="end" fill="#f0efec">i18next</text>
<path d="M99,91H104.7A4,4 0 0 1 108.7,95V101A4,4 0 0 1 104.7,105H99Z" fill="#898781"/>
<text x="114.7" y="103" font-size="14" fill="#f0efec" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">201 ms</text>
<text x="89" y="135" font-size="14" text-anchor="end" fill="#f0efec">use-intl</text>
<path d="M99,123H104.9A4,4 0 0 1 108.9,127V133A4,4 0 0 1 104.9,137H99Z" fill="#898781"/>
<text x="114.9" y="135" font-size="14" fill="#f0efec" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">205 ms</text>
<text x="89" y="167" font-size="14" text-anchor="end" font-weight="600" fill="#f0efec">grai</text>
<path d="M99,155H109.3A4,4 0 0 1 113.3,159V165A4,4 0 0 1 109.3,169H99Z" fill="#3987e5"/>
<text x="119.3" y="167" font-size="14" fill="#f0efec" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">297 ms</text>
<text x="89" y="199" font-size="14" text-anchor="end" fill="#f0efec">Paraglide</text>
<path d="M99,187H342.5A4,4 0 0 1 346.5,191V197A4,4 0 0 1 342.5,201H99Z" fill="#898781"/>
<text x="352.5" y="199" font-size="14" fill="#f0efec" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">5.14 s</text>
<text x="388" y="251" font-size="12" text-anchor="end" fill="#c3c2b7">milliseconds</text>
