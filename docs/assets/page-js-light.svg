<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>A page of 2,000 messages: its JS</title>
<rect x="0.5" y="0.5" width="479" height="259" rx="6" fill="#ffffff" stroke="#e1e0d9"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#0b0b0b">A page of 2,000 messages: its JS</text>
<text x="16" y="44" font-size="13" fill="#52514e">KB brotli, the page's own code and its messages included;</text>
<text x="16" y="61" font-size="13" fill="#52514e">lower is better</text>
<line x1="99" y1="82" x2="99" y2="214" stroke="#c3c2b7" stroke-width="1"/>
<text x="99" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">0</text>
<line x1="195.3" y1="82" x2="195.3" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="195.3" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">50</text>
<line x1="291.7" y1="82" x2="291.7" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="291.7" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">100</text>
<line x1="388" y1="82" x2="388" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="388" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">150</text>
<text x="89" y="103" font-size="14" text-anchor="end" font-weight="600" fill="#0b0b0b">grai</text>
<path d="M99,91H138.5A4,4 0 0 1 142.5,95V101A4,4 0 0 1 138.5,105H99Z" fill="#2a78d6"/>
<text x="148.5" y="103" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">22.6 KB</text>
<text x="89" y="135" font-size="14" text-anchor="end" fill="#0b0b0b">Paraglide</text>
<path d="M99,123H165.7A4,4 0 0 1 169.7,127V133A4,4 0 0 1 165.7,137H99Z" fill="#898781"/>
<text x="175.7" y="135" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">36.7 KB</text>
<text x="89" y="167" font-size="14" text-anchor="end" fill="#0b0b0b">use-intl</text>
<path d="M99,155H339.9A4,4 0 0 1 343.9,159V165A4,4 0 0 1 339.9,169H99Z" fill="#898781"/>
<text x="349.9" y="167" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">127.1 KB</text>
<text x="89" y="199" font-size="14" text-anchor="end" fill="#0b0b0b">i18next</text>
<path d="M99,187H344A4,4 0 0 1 348,191V197A4,4 0 0 1 344,201H99Z" fill="#898781"/>
<text x="354" y="199" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">129.2 KB</text>
<text x="388" y="251" font-size="12" text-anchor="end" fill="#52514e">KB, brotli</text>
