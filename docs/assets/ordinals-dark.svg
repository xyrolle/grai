<text x="302" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">400</text>
<line x1="345" y1="65" x2="345" y2="165" stroke="#2c2c2a" stroke-width="1"/>
<text x="345" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">600</text>
<line x1="388" y1="65" x2="388" y2="165" stroke="#2c2c2a" stroke-width="1"/>
<text x="388" y="182" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">800</text>
<text x="206" y="86" font-size="14" text-anchor="end" font-weight="600" fill="#f0efec">grai</text>
<path d="M216,74H216A1,1 0 0 1 217,75V87A1,1 0 0 1 216,88H216Z" fill="#3987e5"/>
<path d="M216.6,81H217.1M216.6,77V85M217.1,77V85" stroke="#f0efec" stroke-width="1.5" fill="none"/>
<text x="223.1" y="86" font-size="14" fill="#f0efec" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">4.3 ns</text>
<text x="206" y="118" font-size="14" text-anchor="end" fill="#f0efec">Intl.PluralRules, cached</text>
