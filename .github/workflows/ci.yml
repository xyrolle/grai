name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm size
      - run: pnpm test:performance
      - run: pnpm --filter grai-site build

  # The tests on the current 22.x, the LTS and the current release, on each system: paths differ on
  # Windows, and how files are watched differs on each. The repository's dev tools, Astro 7's
  # packages, and jsdom's and Nuxt's undici, need Node 22.23.4 or later; the package's own oldest
  # Node, 22.18.0, is the `oldest-node` job's.
  test:
    name: test (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24", "26"]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test

  # The package as published, on the oldest Node its `engines` accepts: built and packed with the
  # dev tools on Node 24, then installed from its tarball into a project of its own on Node 22.18.0,
  # where it compiles, registers its hooks and builds the page with Vite (`test/oldest-node`).
  oldest-node:
    name: package (Node 22.18.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - run: node test/oldest-node/run.mjs "$RUNNER_TEMP"/package/*.tgz
