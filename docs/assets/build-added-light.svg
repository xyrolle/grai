<text x="226.9" y="146" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">4.22 s</text>
<text x="16" y="175" font-size="13" font-weight="600" fill="#52514e">13,326 keys</text>
<text x="89" y="206" font-size="14" text-anchor="end" font-weight="600" fill="#0b0b0b">grai</text>
<path d="M99,194H121.6A4,4 0 0 1 125.6,198V204A4,4 0 0 1 121.6,208H99Z" fill="#2a78d6"/>
<text x="131.6" y="206" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">0.92 s</text>
<text x="89" y="238" font-size="14" text-anchor="end" fill="#0b0b0b">Paraglide</text>
<path d="M99,226H337.9A4,4 0 0 1 341.9,230V236A4,4 0 0 1 337.9,240H99Z" fill="#898781"/>
<text x="347.9" y="238" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">8.40 s</text>
<text x="388" y="290" font-size="12" text-anchor="end" fill="#52514e">seconds</text>
