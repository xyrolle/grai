<text x="294" y="351" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">5</text>
<line x1="341" y1="82" x2="341" y2="334" stroke="#2c2c2a" stroke-width="1"/>
<text x="341" y="351" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">10</text>
<line x1="388" y1="82" x2="388" y2="334" stroke="#2c2c2a" stroke-width="1"/>
<text x="388" y="351" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">15</text>
<text x="16" y="100" font-size="13" font-weight="600" fill="#c3c2b7">6,366 keys</text>
<text x="237" y="131" font-size="14" text-anchor="end" font-weight="600" fill="#f0efec">grai</text>
<path d="M247,119H247A1.2,1.2 0 0 1 248.2,120.2V131.8A1.2,1.2 0 0 1 247,133H247Z" fill="#3987e5"/>
<text x="254.2" y="131" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">124 ms</text>
<text x="237" y="163" font-size="14" text-anchor="end" fill="#f0efec">Paraglide</text>
<path d="M247,151H284.8A4,4 0 0 1 288.8,155V161A4,4 0 0 1 284.8,165H247Z" fill="#898781"/>
<text x="294.8" y="163" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">4.45 s</text>
<text x="237" y="195" font-size="14" text-anchor="end" fill="#f0efec">Paraglide, with declarations</text>
