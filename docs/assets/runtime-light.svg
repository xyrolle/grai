<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>The runtime in a page</title>
<rect x="0.5" y="0.5" width="479" height="259" rx="6" fill="#ffffff" stroke="#e1e0d9"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#0b0b0b">The runtime in a page</text>
<text x="16" y="44" font-size="13" fill="#52514e">KB brotli, bundled and minified, messages not counted;</text>
<text x="16" y="61" font-size="13" fill="#52514e">lower is better</text>
<line x1="99" y1="82" x2="99" y2="214" stroke="#c3c2b7" stroke-width="1"/>
<text x="99" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">0</text>
<line x1="156.8" y1="82" x2="156.8" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="156.8" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">2.5</text>
<line x1="214.6" y1="82" x2="214.6" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="214.6" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">5</text>
<line x1="272.4" y1="82" x2="272.4" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="272.4" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">7.5</text>
<line x1="330.2" y1="82" x2="330.2" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="330.2" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">10</text>
<line x1="388" y1="82" x2="388" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="388" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">13</text>
<text x="89" y="103" font-size="14" text-anchor="end" font-weight="600" fill="#0b0b0b">grai</text>
<path d="M99,91H109.4A4,4 0 0 1 113.4,95V101A4,4 0 0 1 109.4,105H99Z" fill="#2a78d6"/>
<text x="119.4" y="103" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">0.6 KB</text>
<text x="89" y="135" font-size="14" text-anchor="end" fill="#0b0b0b">Paraglide</text>
<path d="M99,123H178.6A4,4 0 0 1 182.6,127V133A4,4 0 0 1 178.6,137H99Z" fill="#898781"/>
<text x="188.6" y="135" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">3.6 KB</text>
<text x="89" y="167" font-size="14" text-anchor="end" fill="#0b0b0b">use-intl</text>
<path d="M99,155H331.6A4,4 0 0 1 335.6,159V165A4,4 0 0 1 331.6,169H99Z" fill="#898781"/>
<text x="341.6" y="167" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">10.2 KB</text>
<text x="89" y="199" font-size="14" text-anchor="end" fill="#0b0b0b">i18next</text>
<path d="M99,187H374A4,4 0 0 1 378,191V197A4,4 0 0 1 374,201H99Z" fill="#898781"/>
<text x="384" y="199" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">12.1 KB</text>
<text x="388" y="251" font-size="12" text-anchor="end" fill="#52514e">KB, brotli</text>
</svg>
