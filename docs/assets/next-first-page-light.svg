<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 196" width="480" height="196" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Next.js: the first page of a cold next dev</title>
<rect x="0.5" y="0.5" width="479" height="195" rx="6" fill="#ffffff" stroke="#e1e0d9"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#0b0b0b">Next.js: the first page of a cold next dev</text>
<text x="16" y="44" font-size="13" fill="#52514e">Milliseconds until the page's first response, from an empty .next;</text>
<text x="16" y="61" font-size="13" fill="#52514e">lower is better</text>
<line x1="99" y1="82" x2="99" y2="150" stroke="#c3c2b7" stroke-width="1"/>
<text x="99" y="167" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">0</text>
<line x1="195.3" y1="82" x2="195.3" y2="150" stroke="#e1e0d9" stroke-width="1"/>
<text x="195.3" y="167" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">500</text>
<line x1="291.7" y1="82" x2="291.7" y2="150" stroke="#e1e0d9" stroke-width="1"/>
<text x="291.7" y="167" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">1,000</text>
<line x1="388" y1="82" x2="388" y2="150" stroke="#e1e0d9" stroke-width="1"/>
<text x="388" y="167" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">1,500</text>
<text x="89" y="103" font-size="14" text-anchor="end" fill="#0b0b0b">next-intl</text>
<path d="M99,91H326.3A4,4 0 0 1 330.3,95V101A4,4 0 0 1 326.3,105H99Z" fill="#898781"/>
<text x="336.3" y="103" font-size="14" fill="#0b0b0b" style="font-variant-numeric: tabular-nums">1.20 s</text>
<text x="89" y="135" font-size="14" text-anchor="end" font-weight="600" fill="#0b0b0b">grai</text>
<path d="M99,123H367.5A4,4 0 0 1 371.5,127V133A4,4 0 0 1 367.5,137H99Z" fill="#2a78d6"/>
<text x="377.5" y="135" font-size="14" fill="#0b0b0b" style="font-variant-numeric: tabular-nums">1.41 s</text>
<text x="388" y="187" font-size="12" text-anchor="end" fill="#52514e">milliseconds</text>
</svg>
