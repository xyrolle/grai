<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>A cold Vite dev server, until its page shows</title>
<text x="16" y="24" font-size="16" font-weight="600" fill="#f0efec">A cold Vite dev server, until its page shows</text>
<text x="16" y="44" font-size="13" fill="#c3c2b7">Milliseconds from the server's creation, with no output or cache;</text>
<text x="16" y="61" font-size="13" fill="#c3c2b7">lower is better</text>
<line x1="99" y1="82" x2="99" y2="214" stroke="#383835" stroke-width="1"/>
<text x="99" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">0</text>
<line x1="171.3" y1="82" x2="171.3" y2="214" stroke="#2c2c2a" stroke-width="1"/>
<text x="171.3" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">1,000</text>
<line x1="243.5" y1="82" x2="243.5" y2="214" stroke="#2c2c2a" stroke-width="1"/>
<text x="243.5" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">2,000</text>
<line x1="315.8" y1="82" x2="315.8" y2="214" stroke="#2c2c2a" stroke-width="1"/>
<text x="315.8" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">3,000</text>
<line x1="388" y1="82" x2="388" y2="214" stroke="#2c2c2a" stroke-width="1"/>
<text x="388" y="231" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">4,000</text>
<text x="89" y="103" font-size="14" text-anchor="end" fill="#f0efec">i18next</text>
<path d="M99,91H107.1A4,4 0 0 1 111.1,95V101A4,4 0 0 1 107.1,105H99Z" fill="#898781"/>
<text x="117.1" y="103" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">168 ms</text>
<text x="89" y="135" font-size="14" text-anchor="end" fill="#f0efec">use-intl</text>
<path d="M99,123H108.2A4,4 0 0 1 112.2,127V133A4,4 0 0 1 108.2,137H99Z" fill="#898781"/>
<text x="118.2" y="135" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">183 ms</text>
<text x="89" y="167" font-size="14" text-anchor="end" font-weight="600" fill="#f0efec">grai</text>
<path d="M99,155H116.4A4,4 0 0 1 120.4,159V165A4,4 0 0 1 116.4,169H99Z" fill="#3987e5"/>
<text x="126.4" y="167" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">296 ms</text>
<text x="89" y="199" font-size="14" text-anchor="end" fill="#f0efec">Paraglide</text>
<path d="M99,187H368.3A4,4 0 0 1 372.3,191V197A4,4 0 0 1 368.3,201H99Z" fill="#898781"/>
<text x="378.3" y="199" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">3.78 s</text>
<text x="388" y="251" font-size="12" text-anchor="end" fill="#c3c2b7">milliseconds</text>
