<text x="342.2" y="195" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">9.49 s</text>
<text x="16" y="224" font-size="13" font-weight="600" fill="#c3c2b7">13,326 keys</text>
<text x="237" y="255" font-size="14" text-anchor="end" font-weight="600" fill="#f0efec">grai</text>
<path d="M247,243H247A1.4,1.4 0 0 1 248.4,244.4V255.6A1.4,1.4 0 0 1 247,257H247Z" fill="#3987e5"/>
<text x="254.4" y="255" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">147 ms</text>
<text x="237" y="287" font-size="14" text-anchor="end" fill="#f0efec">Paraglide</text>
<path d="M247,275H302.4A4,4 0 0 1 306.4,279V285A4,4 0 0 1 302.4,289H247Z" fill="#898781"/>
<text x="312.4" y="287" font-size="14" fill="#f0efec" style="font-variant-numeric: tabular-nums">6.32 s</text>
