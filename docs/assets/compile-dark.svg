<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Compiling the catalogs</title>
<rect x="0.5" y="0.5" width="479" height="379" rx="6" fill="#0d1117" stroke="#2c2c2a"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#f0efec">Compiling the catalogs</text>
<text x="16" y="44" font-size="13" fill="#c3c2b7">Seconds for a full compile of three locales, in a new process;</text>
<text x="16" y="61" font-size="13" fill="#c3c2b7">lower is better</text>
<line x1="247" y1="82" x2="247" y2="334" stroke="#383835" stroke-width="1"/>
<text x="247" y="351" font-size="12" text-anchor="middle" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">0</text>
