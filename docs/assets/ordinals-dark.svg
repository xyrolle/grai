<text x="206" y="150" font-size="14" text-anchor="end" fill="#f0efec">Paraglide</text>
<path d="M216,138H326.4A4,4 0 0 1 330.4,142V148A4,4 0 0 1 326.4,152H216Z" fill="#898781"/>
<path d="M319,145H346.8M319,141V149M346.8,141V149" stroke="#f0efec" stroke-width="1.5" fill="none"/>
