<text x="214.6" y="270" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">4</text>
<line x1="272.4" y1="65" x2="272.4" y2="253" stroke="#e1e0d9" stroke-width="1"/>
<text x="272.4" y="270" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">6</text>
<line x1="330.2" y1="65" x2="330.2" y2="253" stroke="#e1e0d9" stroke-width="1"/>
<text x="330.2" y="270" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">8</text>
<line x1="388" y1="65" x2="388" y2="253" stroke="#e1e0d9" stroke-width="1"/>
<text x="388" y="270" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">10</text>
<text x="16" y="83" font-size="13" font-weight="600" fill="#52514e">6,366 keys</text>
<text x="89" y="114" font-size="14" text-anchor="end" font-weight="600" fill="#0b0b0b">grai</text>
<path d="M99,102H108.1A4,4 0 0 1 112.1,106V112A4,4 0 0 1 108.1,116H99Z" fill="#2a78d6"/>
<text x="118.1" y="114" font-size="14" fill="#0b0b0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="font-variant-numeric: tabular-nums">0.45 s</text>
<text x="89" y="146" font-size="14" text-anchor="end" fill="#0b0b0b">Paraglide</text>
