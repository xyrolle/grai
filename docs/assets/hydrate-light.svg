<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Hydrating a page of 2,000 messages</title>
<text x="16" y="24" font-size="16" font-weight="600" fill="#0b0b0b">Hydrating a page of 2,000 messages</text>
<text x="16" y="44" font-size="13" fill="#52514e">Milliseconds from the script's evaluation to the page hydrated;</text>
<text x="16" y="61" font-size="13" fill="#52514e">lower is better</text>
<line x1="99" y1="82" x2="99" y2="214" stroke="#c3c2b7" stroke-width="1"/>
<text x="99" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">0</text>
<line x1="171.3" y1="82" x2="171.3" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="171.3" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">5</text>
<line x1="243.5" y1="82" x2="243.5" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="243.5" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">10</text>
<line x1="315.8" y1="82" x2="315.8" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="315.8" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">15</text>
<line x1="388" y1="82" x2="388" y2="214" stroke="#e1e0d9" stroke-width="1"/>
<text x="388" y="231" font-size="12" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">20</text>
<text x="89" y="103" font-size="14" text-anchor="end" font-weight="600" fill="#0b0b0b">grai</text>
<path d="M99,91H180.3A4,4 0 0 1 184.3,95V101A4,4 0 0 1 180.3,105H99Z" fill="#2a78d6"/>
<text x="190.3" y="103" font-size="14" fill="#0b0b0b" style="font-variant-numeric: tabular-nums">5.9 ms</text>
<text x="89" y="135" font-size="14" text-anchor="end" fill="#0b0b0b">Paraglide</text>
<path d="M99,123H220.7A4,4 0 0 1 224.7,127V133A4,4 0 0 1 220.7,137H99Z" fill="#898781"/>
<text x="230.7" y="135" font-size="14" fill="#0b0b0b" style="font-variant-numeric: tabular-nums">8.7 ms</text>
<text x="89" y="167" font-size="14" text-anchor="end" fill="#0b0b0b">i18next</text>
<path d="M99,155H275.6A4,4 0 0 1 279.6,159V165A4,4 0 0 1 275.6,169H99Z" fill="#898781"/>
<text x="285.6" y="167" font-size="14" fill="#0b0b0b" style="font-variant-numeric: tabular-nums">12.5 ms</text>
<text x="89" y="199" font-size="14" text-anchor="end" fill="#0b0b0b">use-intl</text>
<path d="M99,187H360.9A4,4 0 0 1 364.9,191V197A4,4 0 0 1 360.9,201H99Z" fill="#898781"/>
<text x="370.9" y="199" font-size="14" fill="#0b0b0b" style="font-variant-numeric: tabular-nums">18.4 ms</text>
<text x="388" y="251" font-size="12" text-anchor="end" fill="#52514e">milliseconds</text>
</svg>
